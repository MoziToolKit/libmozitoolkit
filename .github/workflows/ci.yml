name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Temporary real-pack asset mirror (see `tests` job). Remove this variable and the
  # "Download real Minecraft assets" step once CI migrates to a maintained source.
  # The step is intentionally non-fatal: if the mirror disappears, tests fall back to the
  # vendored `mtk-testkit` fixtures instead of failing.
  MTK_CI_ASSETS_BASE: https://github.com/mozi1924/mtk-ci-assets/releases/download/ci-assets-v1

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: Architectural guardrails
        run: python3 tools/ci_guardrails.py
      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (workspace, real packs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # PyO3's `auto-initialize` test dependency links against a real Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Download real Minecraft assets
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mtk-assets"
          mkdir -p "$work"
          jar_ok=0
          pack_ok=0
          save_ok=0
          mods_ok=0
          if curl -fL --retry 3 -o "$work/mc.jar" "$MTK_CI_ASSETS_BASE/26.2-Fabric.jar"; then
            mkdir -p "$work/mc"
            unzip -q "$work/mc.jar" -d "$work/mc"
            echo "MTK_TEST_ASSETS=$work/mc" >> "$GITHUB_ENV"
            echo "MTK_TEST_JAR=$work/mc.jar" >> "$GITHUB_ENV"
            jar_ok=1
          else
            echo "::warning::Real Minecraft jar unavailable; real-pack tests will fall back to vendored fixtures."
          fi
          if curl -fL --retry 3 -o "$work/SPBR-21.zip" "$MTK_CI_ASSETS_BASE/SPBR-21.zip"; then
            echo "MTK_TEST_RESOURCE_PACK=$work/SPBR-21.zip" >> "$GITHUB_ENV"
            pack_ok=1
          else
            echo "::warning::External resource pack unavailable; companion-pack tests will be skipped."
          fi
          if curl -fL --retry 3 -o "$work/mtk-save-world.tar.gz" "$MTK_CI_ASSETS_BASE/mtk-save-world.tar.gz"; then
            tar -xzf "$work/mtk-save-world.tar.gz" -C "$work"
            if [ -d "$work/mtk-save-world" ]; then
              echo "MTK_TEST_SAVE=$work/mtk-save-world" >> "$GITHUB_ENV"
              save_ok=1
            else
              echo "::warning::Sample save world archive missing expected directory; save tests may skip."
            fi
          else
            echo "::warning::Sample save world unavailable; save tests will skip if not present."
          fi
          if curl -fL --retry 3 -o "$work/mod-samples.tar.gz" "$MTK_CI_ASSETS_BASE/mod-samples.tar.gz"; then
            tar -xzf "$work/mod-samples.tar.gz" -C "$work"
            if [ -d "$work/mod-samples" ]; then
              echo "MTK_TEST_MOD_DIR=$work/mod-samples" >> "$GITHUB_ENV"
              mods_ok=1
            else
              echo "::warning::Sample mod archive missing expected directory; OBJ mod tests may skip."
            fi
          else
            echo "::warning::Sample mod archive unavailable; OBJ mod tests will skip if not present."
          fi
          # Only demand full coverage when the full asset set really is present: from here on a
          # test that would skip for missing assets fails instead, so a green run proves coverage.
          if [ "$jar_ok" = "1" ] && [ "$pack_ok" = "1" ] && [ "$save_ok" = "1" ] && [ "$mods_ok" = "1" ]; then
            echo "MTK_REQUIRE_REAL_ASSETS=1" >> "$GITHUB_ENV"
          fi
      - name: cargo test --workspace
        run: cargo test --workspace --no-fail-fast

  test-windows:
    name: Test (Windows workspace)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # PyO3's `auto-initialize` test dependency links against a real Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Asset-dependent tests resolve vendored `mtk-testkit` fixtures and skip
      # gracefully when the real Minecraft pack is unavailable.
      - name: cargo test --workspace
        run: cargo test --workspace --no-fail-fast
      - name: Smoke check JNI dynamic library (Windows)
        run: |
          cargo build -p mtk-jni --release
          if (-not (Test-Path target/release/mtk_jni.dll)) { throw "mtk_jni.dll not found" }

  wasm:
    name: WASM compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (mtk-wasm)
        run: cargo check -p mtk-wasm --target wasm32-unknown-unknown

  wheel-smoke:
    name: Wheel smoke check (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert DNA leaf dependencies
        run: |
          cargo tree -p mtk-blender-dna
          if cargo tree -p mtk-blender-dna | grep -Eq 'mtk-(core|voxel|material|model|texture|resource)'; then
            echo "::error::mtk-blender-dna must not depend on core crates"
            exit 1
          fi
      - name: Build wheels
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist -m bindings/mtk-py/Cargo.toml
          maturin build --release --out dist -m adapters/blender/mtk-blender-dna-py/Cargo.toml
      - name: Verify wheel imports
        run: |
          python -m pip install --upgrade pip pytest numpy
          python -m pip install dist/*.whl
          python -c "import libmtk_py; print('libmtk_py', libmtk_py.version(), 'api', libmtk_py.api_version())"
          python -c "import libmtk_blender_dna; print('libmtk_blender_dna', libmtk_blender_dna.api_version())"
          pytest bindings/mtk-py/tests/ -q
          pytest adapters/blender/mtk-blender-dna-py/tests/ -q
      - name: Smoke check JNI dynamic library (Linux)
        run: |
          cargo build -p mtk-jni --release
          test -f target/release/libmtk_jni.so

