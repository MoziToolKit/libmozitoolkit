<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoziToolKit Web Viewer — .mtkscene 3D Preview</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1>MoziToolKit <code>.mtkscene</code> Viewer</h1>
        <span id="status-badge" class="badge" role="status" aria-live="polite">WASM 初始化中…</span>
      </div>
      <div class="actions">
        <label class="btn primary" for="file-input">选择 .mtkscene</label>
        <input id="file-input" type="file" accept=".mtkscene" class="sr-only">
        <button id="btn-reset-cam" type="button" class="btn" disabled>重置视角</button>
      </div>
    </header>

    <main class="viewport-wrap" id="drop-zone">
      <canvas id="gl-canvas" aria-label="Minecraft 3D 场景渲染画布"></canvas>

      <div id="empty-overlay" class="empty-overlay">
        <div class="drop-card">
          <p class="drop-title">拖放 <code>.mtkscene</code> 文件到此处</p>
          <p class="drop-sub">或点击右上角按钮选择本地文件（纯浏览器端 WASM 解码与 Three.js PBR 渲染）</p>
        </div>
      </div>

      <aside class="hud-panel" aria-label="场景信息与渲染选项">
        <details open>
          <summary>渲染与场景统计</summary>
          <div class="hud-body">
            <div class="control-row">
              <label><input id="opt-ao" type="checkbox" checked> 顶点环境光遮蔽 (AO)</label>
              <label><input id="opt-fluids" type="checkbox" checked> 流体网格</label>
              <label><input id="opt-ctm" type="checkbox" checked> CTM 连接纹理</label>
              <label><input id="opt-anim" type="checkbox" checked> 动画纹理</label>
            </div>
            <div class="slider-row">
              <label for="opt-sun">日光强度 <output id="sun-val">2.4</output></label>
              <input id="opt-sun" type="range" min="0.2" max="5.0" step="0.1" value="2.4">
            </div>
            <dl class="stats-grid" id="scene-stats">
              <dt>体素数</dt><dd id="stat-voxels">—</dd>
              <dt>包围盒</dt><dd id="stat-bounds">—</dd>
              <dt>批次数</dt><dd id="stat-batches">—</dd>
              <dt>三角形</dt><dd id="stat-tris">—</dd>
              <dt>WASM 解析</dt><dd id="stat-open-ms">—</dd>
              <dt>网格构建</dt><dd id="stat-mesh-ms">—</dd>
            </dl>
          </div>
        </details>
      </aside>
    </main>
  </div>

  <script type="module" src="./viewer.js"></script>
</body>
</html>
