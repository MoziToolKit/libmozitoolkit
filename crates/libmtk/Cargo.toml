[package]
name = "libmtk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Unified facade library for MoziToolKit core functionality."

[dependencies]
mtk-core = { workspace = true }
mtk-cull = { workspace = true }
mtk-model = { workspace = true }
mtk-voxel = { workspace = true }
mtk-resource = { workspace = true }
xxhash-rust = { workspace = true }
mtk-texture = { workspace = true }
mtk-material = { workspace = true }
mtk-package = { path = "../mtk-package", version = "2.0.0", default-features = false }
mtk-save = { path = "../mtk-save", version = "2.0.0", optional = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }

[features]
default = ["parallel", "save", "mmap"]
mmap = [
    "mtk-package/mmap",
]
parallel = [
    "mtk-core/parallel",
    "mtk-model/parallel",
    "mtk-voxel/parallel",
    "mtk-texture/parallel",
    "mtk-material/parallel",
    "mtk-save?/parallel",
    "dep:rayon",
]
save = [
    "dep:mtk-save",
]

[dev-dependencies]
mtk-testkit = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
glam = { workspace = true }


[lints]
workspace = true
