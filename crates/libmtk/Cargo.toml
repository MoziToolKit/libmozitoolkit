[package]
name = "libmtk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Unified facade library for MoziToolKit core functionality."

[dependencies]
mtk-core = { workspace = true }
mtk-cull = { workspace = true }
mtk-model = { workspace = true }
mtk-voxel = { workspace = true }
mtk-resource = { workspace = true }
mtk-texture = { workspace = true }
mtk-material = { workspace = true }
mtk-package = { workspace = true }
mtk-save = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }

[features]
default = ["parallel", "save"]
parallel = [
    "mtk-core/parallel",
    "mtk-model/parallel",
    "mtk-voxel/parallel",
    "mtk-resource/parallel",
    "mtk-texture/parallel",
    "mtk-material/parallel",
    "dep:rayon",
]
save = [
    "dep:mtk-save",
]

[dev-dependencies]
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
glam = { workspace = true }


[lints]
workspace = true
