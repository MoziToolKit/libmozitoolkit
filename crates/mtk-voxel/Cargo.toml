[package]
name = "mtk-voxel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Section and World-level voxel storage, fluid surface calculation, ambient occlusion, chunk meshing, and source abstraction for libmtk."

[dependencies]
mtk-core = { workspace = true }
mtk-cull = { workspace = true }
mtk-model = { workspace = true }
mtk-resource = { workspace = true }
mtk-texture = { workspace = true }
mtk-material = { workspace = true }
glam = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
flate2 = { workspace = true }
rayon = { workspace = true, optional = true }

[features]
default = ["parallel", "serde"]
parallel = ["dep:rayon", "mtk-model/parallel", "mtk-texture/parallel"]
serde = ["dep:serde", "dep:serde_json", "mtk-core/serde", "mtk-cull/serde"]

[dev-dependencies]
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
mtk-testkit = { workspace = true }

[lints]
workspace = true
