[package]
name = "mtk-resource"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Headless Minecraft resource pack virtual file system, .mcmeta, and vanilla atlases/*.json data models."

[dependencies]
mtk-core = { workspace = true }
glam = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
xxhash-rust = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true, optional = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true, optional = true }

[features]
# `net` is opt-in: only the skin-fetching hosts need ureq/rustls, and every domain crate used to
# link it transitively through the default feature set.
default = ["zip"]
zip = ["dep:zip"]
net = ["dep:ureq"]

[dev-dependencies]
mtk-testkit = { workspace = true }
tempfile = "3.10"

[lints]
workspace = true
