[package]
name = "mtk-save"
version = "2.0.0"
edition = "2021"
authors = ["Mozi <mozi1924@arasaka.ltd>"]
license = "GPL-3.0-or-later"
description = "High-performance Minecraft save (Anvil MCA) loader for MoziToolKit"

[dependencies]
flate2 = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
rayon = { workspace = true, optional = true }
mtk-core = { workspace = true }
mtk-model = { workspace = true }
mtk-voxel = { workspace = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon", "mtk-core/parallel", "mtk-model/parallel", "mtk-voxel/parallel"]
serde = ["dep:serde", "mtk-core/serde", "mtk-voxel/serde"]

[dev-dependencies]
mtk-testkit = { workspace = true }

[lints]
workspace = true
