[workspace]
resolver = "2"
members = [
    "crates/mtk-core",
    "crates/mtk-cull",
    "crates/mtk-model",
    "crates/mtk-voxel",
    "crates/mtk-block-entity-textures",
    "crates/mtk-sync",
    "crates/mtk-resource",
    "crates/mtk-texture",
    "crates/mtk-material",
    "crates/mtk-save",
    "crates/mtk-package",
    "crates/libmtk",
    "crates/mtk-cli",
    "crates/mtk-testkit",
    "bindings/mtk-py",
    "bindings/mtk-jni",
    "bindings/mtk-wasm",
    "adapters/mtk-host-memory",
    "adapters/blender/mtk-blender-dna",
    "adapters/blender/mtk-blender-dna-py",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["Mozi <mozi1924@arasaka.ltd>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/MoziToolKit/libmozitoolkit"
rust-version = "1.89.0"
[workspace.dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
glam = { version = "0.34.3", default-features = false, features = ["libm", "serde", "all-types"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc", "use-std"] }
thiserror = { version = "2.0.21", default-features = false }
bitflags = { version = "2.13.2", default-features = false, features = ["serde"] }
rayon = { version = "1.12.0", default-features = false }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
pyo3 = { version = "0.30.1", default-features = false, features = ["macros"] }
jni = { version = "0.21", default-features = false }
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"
console_error_panic_hook = { version = "0.1.7", default-features = false }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
interprocess = { version = "2.4.10", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
crossbeam-channel = { version = "0.5.17", default-features = false, features = ["std"] }
url = { version = "2.5.8", default-features = false }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
rustc-hash = { version = "2.1.3", features = ["std"] }
zstd = "0.14.4"
ruzstd = "0.9.1"
crc32fast = "1.5.5"
xxhash-rust = { version = "0.8.19", default-features = false, features = ["xxh64"] }
sha2 = { version = "0.11.1", default-features = false }
memmap2 = "0.9.12"
bytemuck = { version = "1.25.2", default-features = false }
# Atlas `filter` patterns are Java regexes matched with `Pattern.asPredicate()` (substring search),
# so reading atlas definitions faithfully needs a regex engine.
regex = "1.12.2"

# Internal workspace crates
mtk-core = { path = "crates/mtk-core", version = "2.0.0" }
mtk-cull = { path = "crates/mtk-cull", version = "2.0.0" }
mtk-model = { path = "crates/mtk-model", version = "2.0.0" }
mtk-voxel = { path = "crates/mtk-voxel", version = "2.0.0" }
mtk-block-entity-textures = { path = "crates/mtk-block-entity-textures", version = "2.0.0" }
mtk-sync = { path = "crates/mtk-sync", version = "2.0.0" }
mtk-resource = { path = "crates/mtk-resource", version = "2.0.0" }
mtk-texture = { path = "crates/mtk-texture", version = "2.0.0" }
mtk-material = { path = "crates/mtk-material", version = "2.0.0" }
mtk-save = { path = "crates/mtk-save", version = "2.0.0" }
mtk-package = { path = "crates/mtk-package", version = "2.0.0" }
libmtk = { path = "crates/libmtk", version = "2.0.0" }
mtk-testkit = { path = "crates/mtk-testkit", version = "2.0.0" }
mtk-blender-dna = { path = "adapters/blender/mtk-blender-dna", version = "2.0.0" }
mtk-host-memory = { path = "adapters/mtk-host-memory", version = "2.0.0" }

# Workspace-wide Clippy policy (opt in per-crate via `[lints] workspace = true`).
# Keep this list small and justified: it only suppresses lints that are inherent to the
# FFI/PyO3 surface, the minimum supported Rust version, or deliberate API naming.
[workspace.lints.clippy]
# PyO3 `#[pyfunction]` / mesher batch entry points legitimately accept many flat parameters
# to avoid per-call allocation and preserve zero-copy semantics.
too_many_arguments = "allow"
# Parallel batch APIs return nested Rayon tuple results (e.g. `Vec<(Vec<f32>, Vec<u16>)>`).
type_complexity = "allow"
# `is_multiple_of` was stabilized in Rust 1.87; kept allowed until the codebase migrates.
manual_is_multiple_of = "allow"
# Deliberate domain-prefixed enum variants and the historical `stitcher::stitcher` layout.
enum_variant_names = "allow"
module_inception = "allow"
# `from_str`/`parse` helpers are internal constructors, not `std::str::FromStr` impls.
should_implement_trait = "allow"
# A few enums carry one intentionally large (baked geometry) variant.
large_enum_variant = "allow"
# Flat-buffer batch kernels index several parallel arrays in lockstep; iterator rewrites
# obscure the index arithmetic used for raw pointer offsets.
needless_range_loop = "allow"
# Serde `serialize_with` / `deserialize_with` signatures must match the on-disk field type
# (which is a `Box<[...]>`).
borrowed_box = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true